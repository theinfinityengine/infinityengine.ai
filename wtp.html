<script>
const {
  useState,
  useEffect,
  useRef,
  useReducer
} = React;

// ── Type ──
const DSP = "'Anton',system-ui,sans-serif";
const F = "'Poppins',system-ui,-apple-system,sans-serif";

// ── Palette (violet + cyan + pink + orange) ──
// muted tones lifted to meet WCAG AA contrast on the dark background
const BG = "#07020f",
  BG2 = "#0d0719",
  AC = "#9a8cff",
  AC2 = "#b9a6ff",
  CY = "#4fe6de",
  PNK = "#ff74ac",
  ORG = "#ff9a5e",
  GRN = "#6ee7ad",
  AMB = "#fcc73d",
  BLU = "#7cb0ff",
  T1 = "#eae6f5",
  T2 = "#b4accf",
  T3 = "#8b82ad";
const HOT = `linear-gradient(135deg,${PNK},${ORG})`;
const BRAND = `linear-gradient(135deg,${AC},${PNK},${ORG})`;
const CSS = `
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:rgba(255,92,157,.3)}
html{scroll-behavior:smooth}
body{font-family:${F}}
/* Visible keyboard focus for every interactive element (WCAG 2.4.7) */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,[role=button]:focus-visible,[role=tab]:focus-visible{outline:3px solid #ffe14d;outline-offset:2px;border-radius:6px}
input:focus,textarea:focus,select:focus{outline:none;border-color:${AC}!important}
/* Honor reduced-motion preference (WCAG 2.3.3) */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* Screen-reader-only text */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Skip link: hidden until focused */
.skip-link{position:absolute;left:-9999px;top:8px;z-index:9999;background:${BG2};color:${T1};padding:10px 16px;border-radius:10px;border:1px solid ${AC};font-size:13px;font-weight:600;text-decoration:none}
.skip-link:focus{left:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(124,109,240,.25);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
`;

// ════════════ DATA LAYER (Supabase when configured, localStorage otherwise) ════════════
const SUPABASE_URL = ""; // optional: hardcode here, or paste in the app under Settings
const SUPABASE_ANON_KEY = "";
const SCHEMA_SQL = "-- ============================================================\n-- We The People. Foundation schema for Supabase\n-- Run this once in your Supabase project: SQL Editor > New query > paste > Run.\n-- Safe to re-run; \"already exists / already member of publication\" notices are fine.\n-- After running, go to Authentication > Providers > Email and (for a prototype)\n-- turn OFF \"Confirm email\" so sign-ups can log in immediately.\n-- ============================================================\n\ncreate extension if not exists pgcrypto;\n\n-- ---------- PROFILES (identity) ----------\ncreate table if not exists public.profiles (\n  id          uuid primary key references auth.users on delete cascade,\n  email       text,\n  name        text default '',\n  verifications text[] default '{}',\n  trust_level int default 0,\n  created_at  timestamptz default now()\n);\nalter table public.profiles enable row level security;\ndrop policy if exists \"profiles_read\"   on public.profiles;\ndrop policy if exists \"profiles_insert\" on public.profiles;\ndrop policy if exists \"profiles_update\" on public.profiles;\ncreate policy \"profiles_read\"   on public.profiles for select using (true);\ncreate policy \"profiles_insert\" on public.profiles for insert with check (auth.uid() = id);\ncreate policy \"profiles_update\" on public.profiles for update using (auth.uid() = id);\n\n-- auto-create a profile row whenever a new auth user signs up\ncreate or replace function public.handle_new_user()\nreturns trigger language plpgsql security definer set search_path = public as $\nbegin\n  insert into public.profiles (id, email) values (new.id, new.email)\n  on conflict (id) do nothing;\n  return new;\nend; $;\ndrop trigger if exists on_auth_user_created on auth.users;\ncreate trigger on_auth_user_created\n  after insert on auth.users for each row execute procedure public.handle_new_user();\n\n-- ---------- COMMUNITIES (community tools) ----------\ncreate table if not exists public.communities (\n  id          uuid primary key default gen_random_uuid(),\n  name        text not null,\n  type        text,\n  description text,\n  privacy     text default 'public',\n  voting      text default 'ranked',\n  members     int  default 0,     -- maintained by the membership trigger below\n  created_by  uuid references auth.users,\n  created_at  timestamptz default now()\n);\nalter table public.communities enable row level security;\ndrop policy if exists \"communities_read\"   on public.communities;\ndrop policy if exists \"communities_insert\" on public.communities;\ndrop policy if exists \"communities_update\" on public.communities;\ncreate policy \"communities_read\" on public.communities for select\n  using (privacy = 'public' or created_by = auth.uid()\n         or exists (select 1 from public.memberships m\n                    where m.community_id = communities.id and m.user_id = auth.uid()));\ncreate policy \"communities_insert\" on public.communities for insert with check (auth.uid() = created_by);\ncreate policy \"communities_update\" on public.communities for update using (auth.uid() = created_by);\n\n-- ---------- MEMBERSHIPS ----------\ncreate table if not exists public.memberships (\n  id           uuid primary key default gen_random_uuid(),\n  community_id uuid references public.communities on delete cascade,\n  user_id      uuid references auth.users,\n  role         text default 'member',\n  created_at   timestamptz default now(),\n  unique (community_id, user_id)\n);\nalter table public.memberships enable row level security;\ndrop policy if exists \"memberships_read\"   on public.memberships;\ndrop policy if exists \"memberships_insert\" on public.memberships;\ncreate policy \"memberships_read\"   on public.memberships for select using (true);\ncreate policy \"memberships_insert\" on public.memberships for insert with check (auth.uid() = user_id);\n\n-- keep communities.members accurate as people join and leave\ncreate or replace function public.bump_members()\nreturns trigger language plpgsql security definer set search_path = public as $\nbegin\n  if (TG_OP = 'INSERT') then\n    update public.communities set members = members + 1 where id = new.community_id; return new;\n  elsif (TG_OP = 'DELETE') then\n    update public.communities set members = greatest(members - 1, 0) where id = old.community_id; return old;\n  end if;\n  return null;\nend; $;\ndrop trigger if exists trg_members on public.memberships;\ncreate trigger trg_members after insert or delete on public.memberships\n  for each row execute procedure public.bump_members();\n\n-- ---------- POLLS (living polls) ----------\ncreate table if not exists public.polls (\n  id           uuid primary key default gen_random_uuid(),\n  community_id uuid references public.communities on delete cascade,\n  question     text not null,\n  options      jsonb not null,            -- [{ \"id\": 0, \"label\": \"...\" }, ...]\n  status       text default 'active',\n  created_by   uuid references auth.users,\n  created_at   timestamptz default now()\n);\nalter table public.polls enable row level security;\ndrop policy if exists \"polls_read\"   on public.polls;\ndrop policy if exists \"polls_insert\" on public.polls;\ncreate policy \"polls_read\"   on public.polls for select using (true);\ncreate policy \"polls_insert\" on public.polls for insert with check (auth.uid() = created_by);\n\n-- ---------- POLL VOTES (one per person) ----------\ncreate table if not exists public.poll_votes (\n  id         uuid primary key default gen_random_uuid(),\n  poll_id    uuid references public.polls on delete cascade,\n  user_id    uuid references auth.users,\n  option_id  int not null,\n  created_at timestamptz default now(),\n  unique (poll_id, user_id)\n);\nalter table public.poll_votes enable row level security;\ndrop policy if exists \"votes_read\"   on public.poll_votes;\ndrop policy if exists \"votes_insert\" on public.poll_votes;\ncreate policy \"votes_read\"   on public.poll_votes for select using (true);\ncreate policy \"votes_insert\" on public.poll_votes for insert with check (auth.uid() = user_id);\n\n-- ---------- PROPOSALS ----------\ncreate table if not exists public.proposals (\n  id           uuid primary key default gen_random_uuid(),\n  community_id uuid references public.communities on delete cascade,\n  title        text not null,\n  summary      text,\n  detail       text,\n  category     text,\n  status       text default 'draft',\n  supporters   int default 1,\n  created_by   uuid references auth.users,\n  created_at   timestamptz default now()\n);\nalter table public.proposals enable row level security;\ndrop policy if exists \"proposals_read\"   on public.proposals;\ndrop policy if exists \"proposals_insert\" on public.proposals;\ncreate policy \"proposals_read\"   on public.proposals for select using (true);\ncreate policy \"proposals_insert\" on public.proposals for insert with check (auth.uid() = created_by);\n\n-- ---------- MESSAGES (real-time chat) ----------\ncreate table if not exists public.messages (\n  id           uuid primary key default gen_random_uuid(),\n  community_id uuid references public.communities on delete cascade,\n  user_id      uuid references auth.users,\n  sender_name  text,\n  text         text not null,\n  created_at   timestamptz default now()\n);\nalter table public.messages enable row level security;\ndrop policy if exists \"messages_read\"   on public.messages;\ndrop policy if exists \"messages_insert\" on public.messages;\ncreate policy \"messages_read\"   on public.messages for select using (true);\ncreate policy \"messages_insert\" on public.messages for insert with check (auth.uid() = user_id);\n\n-- ---------- LEDGER (transparency framework: append-only) ----------\ncreate table if not exists public.ledger (\n  id           uuid primary key default gen_random_uuid(),\n  community_id uuid references public.communities on delete cascade,\n  action       text not null,\n  detail       text,\n  actor_name   text,\n  actor_id     uuid,\n  created_at   timestamptz default now()\n);\nalter table public.ledger enable row level security;\ndrop policy if exists \"ledger_read\"   on public.ledger;\ndrop policy if exists \"ledger_insert\" on public.ledger;\ncreate policy \"ledger_read\"   on public.ledger for select using (true);\ncreate policy \"ledger_insert\" on public.ledger for insert with check (auth.uid() = actor_id);\n\n-- ---------- COMMITMENTS (accountability tracker) ----------\ncreate table if not exists public.commitments (\n  id           uuid primary key default gen_random_uuid(),\n  community_id uuid references public.communities on delete cascade,\n  title        text not null,\n  owner        text,                       -- who is accountable (free text / member name)\n  detail       text,\n  category     text,\n  due_date     date,\n  status       text default 'on_track',    -- on_track | at_risk | fulfilled | broken\n  created_by   uuid references auth.users,\n  created_at   timestamptz default now()\n);\nalter table public.commitments enable row level security;\ndrop policy if exists \"commitments_read\"   on public.commitments;\ndrop policy if exists \"commitments_insert\" on public.commitments;\ndrop policy if exists \"commitments_update\" on public.commitments;\ncreate policy \"commitments_read\"   on public.commitments for select using (true);\ncreate policy \"commitments_insert\" on public.commitments for insert with check (auth.uid() = created_by);\ncreate policy \"commitments_update\" on public.commitments for update using (auth.uid() = created_by);\n\n-- ---------- PROPOSAL ENDORSEMENTS (one per person) ----------\ncreate table if not exists public.proposal_endorsements (\n  id          uuid primary key default gen_random_uuid(),\n  proposal_id uuid references public.proposals on delete cascade,\n  user_id     uuid references auth.users,\n  created_at  timestamptz default now(),\n  unique (proposal_id, user_id)\n);\nalter table public.proposal_endorsements enable row level security;\ndrop policy if exists \"endorse_read\"   on public.proposal_endorsements;\ndrop policy if exists \"endorse_insert\" on public.proposal_endorsements;\ndrop policy if exists \"endorse_delete\" on public.proposal_endorsements;\ncreate policy \"endorse_read\"   on public.proposal_endorsements for select using (true);\ncreate policy \"endorse_insert\" on public.proposal_endorsements for insert with check (auth.uid() = user_id);\ncreate policy \"endorse_delete\" on public.proposal_endorsements for delete using (auth.uid() = user_id);\n\n-- ---------- PROPOSAL COMMENTS (deliberation) ----------\ncreate table if not exists public.proposal_comments (\n  id          uuid primary key default gen_random_uuid(),\n  proposal_id uuid references public.proposals on delete cascade,\n  user_id     uuid references auth.users,\n  author_name text,\n  text        text not null,\n  created_at  timestamptz default now()\n);\nalter table public.proposal_comments enable row level security;\ndrop policy if exists \"pcomments_read\"   on public.proposal_comments;\ndrop policy if exists \"pcomments_insert\" on public.proposal_comments;\ncreate policy \"pcomments_read\"   on public.proposal_comments for select using (true);\ncreate policy \"pcomments_insert\" on public.proposal_comments for insert with check (auth.uid() = user_id);\n\n-- allow the proposal author to advance its stage (status)\ndrop policy if exists \"proposals_update\" on public.proposals;\ncreate policy \"proposals_update\" on public.proposals for update using (auth.uid() = created_by);\n\n-- ---------- DELEGATIONS (delegation network) ----------\ncreate table if not exists public.delegations (\n  id             uuid primary key default gen_random_uuid(),\n  community_id   uuid references public.communities on delete cascade,\n  user_id        uuid references auth.users,     -- the delegator\n  category       text default 'all',\n  delegate_name  text not null,                  -- who the voice is delegated to\n  created_at     timestamptz default now()\n);\nalter table public.delegations enable row level security;\ndrop policy if exists \"deleg_read\"   on public.delegations;\ndrop policy if exists \"deleg_insert\" on public.delegations;\ndrop policy if exists \"deleg_delete\" on public.delegations;\ncreate policy \"deleg_read\"   on public.delegations for select using (user_id = auth.uid());\ncreate policy \"deleg_insert\" on public.delegations for insert with check (auth.uid() = user_id);\ncreate policy \"deleg_delete\" on public.delegations for delete using (auth.uid() = user_id);\n\n-- ---------- POLL CATEGORIES (for delegation + consensus by topic) ----------\nalter table public.polls add column if not exists category text default 'all';\n\n-- ---------- LOCAL COUNCILS: SESSIONS + AGENDA (hyperlocal coordination + decisions) ----------\ncreate table if not exists public.council_sessions (\n  id            uuid primary key default gen_random_uuid(),\n  community_id  uuid references public.communities on delete cascade,\n  title         text not null,\n  scheduled_for date,\n  location      text,\n  status        text default 'scheduled',   -- scheduled | completed\n  created_by    uuid references auth.users,\n  created_at    timestamptz default now()\n);\nalter table public.council_sessions enable row level security;\ndrop policy if exists \"sessions_read\"   on public.council_sessions;\ndrop policy if exists \"sessions_insert\" on public.council_sessions;\ndrop policy if exists \"sessions_update\" on public.council_sessions;\ncreate policy \"sessions_read\"   on public.council_sessions for select using (true);\ncreate policy \"sessions_insert\" on public.council_sessions for insert with check (auth.uid() = created_by);\ncreate policy \"sessions_update\" on public.council_sessions for update using (auth.uid() = created_by);\n\ncreate table if not exists public.agenda_items (\n  id           uuid   // cross-community issue aggregation (Issue Mapping)
  async aggregateIssues(communityIds, me) {
    const cats = {};
    let totalVotes = 0,
      totalPolls = 0;
    for (const cid of communityIds) {
      const polls = await api.loadPolls(cid, me);
      for (const p of polls) {
        if (!p.total) continue;
        const top = Math.max(...p.options.map(o => p.counts[o.id] || 0));
        const share = top / p.total;
        const cat = p.category || "all";
        if (!cats[cat]) cats[cat] = {
          cat,
          shareSum: 0,
          polls: 0,
          votes: 0
        };
        cats[cat].shareSum += share;
        cats[cat].polls += 1;
        cats[cat].votes += p.total;
        totalPolls += 1;
        totalVotes += p.total;
      }
    }
    const list = Object.values(cats).map(c => ({
      cat: c.cat,
      share: Math.round(c.shareSum / c.polls * 100),
      polls: c.polls,
      votes: c.votes
    })).sort((a, b) => b.votes - a.votes);
    return {
      list,
      totalPolls,
      totalVotes
    };
  },

    return items.slice(0, limit || 20);
  },
  // global search across content types
  async globalSearch(q, me) {
    const needle = (q || "").toLowerCase().trim();
    if (!needle) return {
      communities: [],
      polls: [],
      proposals: [],
      commitments: [],
      knowledge: []
    };
    const match = s => (s || "").toLowerCase().includes(needle);
    const comms = await api.listCommunities(me);
    const res = {
      communities: comms.filter(c => match(c.name) || match(c.description)),
      polls: [],
      proposals: [],
      commitments: [],
      knowledge: []
    };
    for (const c of comms) {
      try {
        (await api.loadPolls(c.id, me)).forEach(p => {
          if (match(p.question)) res.polls.push({
            ...p,
            community: c.name
          });
        });
      } catch (e) {}
      try {
        (await api.loadProposals(c.id, me)).forEach(p => {
          if (match(p.title) || match(p.summary)) res.proposals.push({
            ...p,
            community: c.name
          });
        });
      } catch (e) {}
      try {
        (await api.loadCommitments(c.id)).forEach(p => {
          if (match(p.title) || match(p.detail)) res.commitments.push({
            ...p,
            community: c.name
          });
        });
      } catch (e) {}
    }
    try {
      (await api.loadKnowledge()).forEach(k => {
        if (match(k.title) || match(k.body)) res.knowledge.push(k);
      });
    } catch (e) {}
    return res;
  },
  // ledger (transparency)
  async loadLedger(cid) {
    if (online()) {
      const {
        data
      } = await sb().from("ledger").select("*").eq("community_id", cid).order("created_at", {
        ascending: false
      }).limit(60);
      return data || [];
    }
    return lget(`wtp-ledger-${cid}`);
  },
  async log(cid, action, detail, me) {
    const row = {
      community_id: cid,
      action,
      detail,
      actor_name: me?.name || me?.email || "Someone",
      actor_id: online() ? me?.id : null,
      created_at: new Date().toISOString()
    };
    if (online()) {
      try {
        await sb().from("ledger").insert({
          community_id: cid,
          action,
          detail,
          actor_name: row.actor_name,
          actor_id: me?.id
        });
      } catch (e) {}
    } else if (cid) {
      const k = `wtp-ledger-${cid}`;
      const arr = lget(k);
      arr.unshift(row);
      lset(k, arr);
    }
  }
};

// Civic API: documented read-only programmatic surface, usable from the browser console
// or any embedded script. Mirrors the open-data commitment. When Supabase is connected
// these same resources are also a live REST API at <project>.supabase.co/rest/v1/<table>.
if (typeof window !== "undefined") {
  window.WTP = {
    version: "0.3",
    get connected() {
      return online();
    },
    resources: ["communities", "polls", "proposals", "commitments", "ledger", "members", "sessions"],
    // WTP.get("ledger", communityId) -> Promise<array>
    get(resource, communityId) {
      return api.exportResource(communityId, resource, null);
    },
    // WTP.export(communityId) -> Promise<{...all resources}>
    async export(communityId) {
      const out = {
        generatedAt: new Date().toISOString(),
        source: online() ? "supabase" : "local",
        communityId
      };
      for (const r of window.WTP.resources) {
        try {
          out[r] = await api.exportResource(communityId, r, null);
        } catch (e) {
          out[r] = [];
        }
      }
      return out;
    }
  };
}
function useMedia(q) {
  const [m, setM] = useState(() => typeof window !== "undefined" && window.matchMedia(q).matches);
  useEffect(() => {
    const mm = window.matchMedia(q);
    const h = e => setM(e.matches);
    mm.addEventListener ? mm.addEventListener("change", h) : mm.addListener(h);
    setM(mm.matches);
    return () => {
      mm.removeEventListener ? mm.removeEventListener("change", h) : mm.removeListener(h);
    };
  }, [q]);
  return m;
}
